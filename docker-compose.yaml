version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    networks:
      - overlay-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - overlay-network

networks:
  overlay-network:
    driver: bridge